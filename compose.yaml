# =============================================================
# AI Invoice Auditor – Docker Compose Specification
# =============================================================
# Starts the complete multi-service application with single command:
#   docker compose up --build -d
# =============================================================

version: "3.9"

services:
  # -----------------------------------------------------------
  # 1. PostgreSQL 16 (Durable System of Record)
  # -----------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoicedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - invoice-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-invoicedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # -----------------------------------------------------------
  # 2. Qdrant (Durable Vector Database for RAG Index)
  # -----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - invoice-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # -----------------------------------------------------------
  # 3. Redis 7 (Disposable Cache for LLM & Translations)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    # Note: No volume mount — Redis is disposable by design
    networks:
      - invoice-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # -----------------------------------------------------------
  # 4. Mock ERP Service (FastAPI for Master Data)
  # -----------------------------------------------------------
  mock-erp:
    build:
      context: ./mock_erp
      dockerfile: Dockerfile
    image: invoice-mock-erp:1.0
    container_name: mock-erp
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-invoicedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoice-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # -----------------------------------------------------------
  # 5. Agent Service (LangGraph Workflow & RAG Engine)
  # -----------------------------------------------------------
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: invoice-agent:1.0
    container_name: agent
    ports:
      - "8000:8000"
    volumes:
      - ./data/incoming:/data/incoming:ro
      - ./outputs/reports:/app/outputs/reports
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-invoicedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ERP_SERVICE_URL: http://mock-erp:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      INCOMING_DIR: /data/incoming
      OUTPUT_REPORTS_DIR: /app/outputs/reports
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoice-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # -----------------------------------------------------------
  # 6. Streamlit UI (Human-in-the-Loop Dashboard)
  # -----------------------------------------------------------
  streamlit-ui:
    build:
      context: ./streamlit_ui
      dockerfile: Dockerfile
    image: invoice-streamlit-ui:1.0
    container_name: streamlit-ui
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-invoicedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AGENT_SERVICE_URL: http://agent:8000
      ERP_SERVICE_URL: http://mock-erp:8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - invoice-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# =============================================================
# Durable Named Volumes (Survive container teardown)
# =============================================================
volumes:
  postgres_data:
    name: invoice_postgres_data
  qdrant_data:
    name: invoice_qdrant_data

# =============================================================
# Bridge Network for Service-Name DNS Resolution
# =============================================================
networks:
  invoice-net:
    name: invoice_network
    driver: bridge
