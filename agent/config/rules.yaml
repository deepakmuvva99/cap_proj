# =============================================================
# AI Invoice Auditor – Validation Rules Configuration
# =============================================================
required_fields:
  header:
    - invoice_no
    - invoice_date
    - vendor_id
    - currency
    - total_amount
  line_item:
    - item_code
    - description
    - qty
    - unit_price
    - total

data_types:
  invoice_no: str
  invoice_date: date
  vendor_id: str
  currency: str
  total_amount: float
  tax_amount: float
  subtotal: float
  qty: float
  unit_price: float
  total: float

tolerances:
  price_difference_percent: 5
  quantity_difference_percent: 0
  tax_difference_percent: 2
  line_item_math_tolerance_percent: 1

accepted_currencies:
  - USD
  - EUR
  - INR
  - GBP

currency_symbol_map:
  "$": "USD"
  "€": "EUR"
  "₹": "INR"
  "£": "GBP"

validation_policies:
  missing_field_action: "flag"
  total_mismatch_action: "manual_review"
  invalid_currency_action: "reject"
  auto_approve_confidence_threshold: 0.95

date_validation:
  accepted_formats:
    - "%Y-%m-%d"
    - "%d/%m/%Y"
    - "%m/%d/%Y"
    - "%d-%m-%Y"
    - "%B %d, %Y"
    - "%d.%m.%Y"
  max_future_days: 7
  stale_invoice_days: 365

reporting:
  include_translation_confidence: true
  include_discrepancy_summary: true
  report_format: "HTML"
  output_dir: "./outputs/reports"

logging:
  enable_audit_log: true
  log_file: "./logs/invoice_auditor.log"
  log_level: "INFO"
